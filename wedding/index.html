<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding URL Test</title>
</head>

<body>

    <h1>Wedding URL Test</h1>

    <p>Name 1: <span id="name1">NOT FOUND</span></p>
    <p>Name 2: <span id="name2">NOT FOUND</span></p>
    <p>Date: <span id="date">NOT FOUND</span></p>
    <p>City: <span id="city">NOT FOUND</span></p>
    <p>Church: <span id="church">NOT FOUND</span></p>
    <p>Venue: <span id="venue">NOT FOUND</span></p>

    <hr>

    <p>Status: <strong id="status">Testing...</strong></p>

    <script>

        const params = new URLSearchParams(window.location.search);

        const name1 = params.get("name1");
        const name2 = params.get("name2");
        const date = params.get("date");
        const city = params.get("city");
        const church = params.get("church");
        const venue = params.get("venue");

        document.getElementById("name1").textContent =
            name1 || "NOT FOUND";

        document.getElementById("name2").textContent =
            name2 || "NOT FOUND";

        document.getElementById("date").textContent =
            date || "NOT FOUND";

        document.getElementById("city").textContent =
            city || "NOT FOUND";

        document.getElementById("church").textContent =
            church || "NOT FOUND";

        document.getElementById("venue").textContent =
            venue || "NOT FOUND";

        if (
            name1 &&
            name2 &&
            date &&
            city &&
            church &&
            venue
        ) {
            document.getElementById("status").textContent =
                "SUCCESS - all URL parameters received";
        } else {
            document.getElementById("status").textContent =
                "ERROR - one or more URL parameters are missing";
        }

    </script>

</body>
</html>
